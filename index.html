<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Polla Mundial MBA 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--sf:#161b22;--sf2:#21262d;--bd:#30363d;--tx:#e6edf3;--mt:#7d8590;--ac:#f0b429;--gbg:#0d2e1a;--gtx:#3fb950;--ybg:#2d1f04;--ytx:#d29922;--rbg:#2d0f0f;--rtx:#f85149;--r:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{background:linear-gradient(135deg,#1a2a1a,#0d1f3c);border-bottom:1px solid var(--bd);padding:24px 20px;text-align:center}
header h1{font-size:1.8rem;font-weight:700}
header h1 span{color:var(--ac)}
header p{color:var(--mt);margin-top:4px;font-size:.9rem}
.upd{font-size:.75rem;color:var(--mt);margin-top:8px}
main{max-width:900px;margin:0 auto;padding:24px 16px}
.stitle{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mt);margin-bottom:12px}
.lb{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.lb table{width:100%;border-collapse:collapse;font-size:.9rem}
.lb thead th{background:var(--sf2);padding:10px 16px;text-align:left;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mt);border-bottom:1px solid var(--bd)}
.lb thead th.c{text-align:center}
.lb tbody tr{border-bottom:1px solid var(--bd);cursor:pointer;transition:background .15s}
.lb tbody tr:last-child{border-bottom:none}
.lb tbody tr:hover{background:var(--sf2)}
.lb tbody td{padding:12px 16px;vertical-align:middle}
.lb tbody td.c{text-align:center}
.rank{font-weight:700;color:var(--mt);width:36px}
.rank.r1{color:#FFD700}.rank.r2{color:#C0C0C0}.rank.r3{color:#CD7F32}
.pname{font-weight:600;display:flex;align-items:center;gap:8px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex-shrink:0}
.av0{background:#1a3a5c;color:#5b9bd5}.av1{background:#3a1a1a;color:#d55b5b}.av2{background:#1a3a1a;color:#5bd55b}
.av3{background:#3a2a1a;color:#d5955b}.av4{background:#2a1a3a;color:#955bd5}.av5{background:#1a3a3a;color:#5bd5d5}
.av6{background:#3a3a1a;color:#d5d55b}.av7{background:#3a1a3a;color:#d55bd5}.av8{background:#1a2a3a;color:#5b95d5}
.av9{background:#3a2a2a;color:#d5955b}.av10{background:#2a3a1a;color:#95d55b}.av11{background:#1a3a2a;color:#5bd595}
.av12{background:#2a1a2a;color:#955b95}.av13{background:#3a1a2a;color:#d55b95}.av14{background:#2a3a3a;color:#5bb5d5}
.pts{font-size:1.1rem;font-weight:700;color:var(--ac)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600}
.badge.ex{background:var(--gbg);color:var(--gtx)}.badge.re{background:var(--ybg);color:var(--ytx)}
.vl{color:var(--ac);font-size:.8rem;opacity:.6}
tr:hover .vl{opacity:1}
.loading{text-align:center;padding:48px;color:var(--mt)}
.spin{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;padding:16px;overflow-y:auto}
.ov.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:780px;margin:20px auto;overflow:hidden}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--bd);background:var(--sf2)}
.mhdr h2{font-size:1.1rem;font-weight:700}
.mstats{display:flex;gap:16px;font-size:.85rem}
.stat .val{font-size:1.4rem;font-weight:700;color:var(--ac)}
.stat .lbl{color:var(--mt);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.mcls{background:none;border:none;color:var(--mt);cursor:pointer;font-size:1.2rem;padding:4px 8px;border-radius:4px;margin-left:16px}
.mcls:hover{color:var(--tx);background:var(--bd)}
.gtabs{display:flex;gap:4px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.gtab{padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;background:var(--sf2);border:1px solid var(--bd);color:var(--mt)}
.gtab.active{background:var(--ac);border-color:var(--ac);color:#000}
.pt{width:100%;border-collapse:collapse;font-size:.85rem}
.pt thead th{padding:8px 12px;text-align:center;font-size:.7rem;font-weight:600;text-transform:uppercase;color:var(--mt);background:var(--sf2);border-bottom:1px solid var(--bd)}
.pt thead th.l{text-align:left}
.pt tbody tr{border-bottom:1px solid var(--bd)}
.pt tbody tr:last-child{border-bottom:none}
.pt tbody td{padding:10px 12px;text-align:center;vertical-align:middle}
.pt tbody td.l{text-align:left}
.mteams{font-weight:600;font-size:.82rem}
.mdate{color:var(--mt);font-size:.72rem;margin-top:2px}
.sc{font-weight:700;font-size:.9rem;padding:4px 8px;border-radius:6px;min-width:42px;display:inline-block}
.sc.pend{color:var(--mt)}
.rexact td{background:var(--gbg)!important}.rcorrect td{background:var(--ybg)!important}.rwrong td{background:var(--rbg)!important}
.pcell{font-weight:700;font-size:.85rem}
.pcell.exact{color:var(--gtx)}.pcell.correct{color:var(--ytx)}.pcell.wrong{color:var(--rtx)}.pcell.pending{color:var(--mt)}
.gtag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:700;background:var(--sf2);border:1px solid var(--bd);color:var(--mt)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--bd);font-size:.75rem;color:var(--mt)}
.li{display:flex;align-items:center;gap:6px}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0}
@media(max-width:600px){
.lb thead th:nth-child(5),.lb tbody td:nth-child(5){display:none}
header h1{font-size:1.4rem}
}
</style>
</head>
<body>
<header>
  <h1>&#9917; Polla <span>Mundial MBA 2026</span></h1>
  <p>Fase de Grupos &mdash; Predice y Gana</p>
  <div class="upd" id="upd"></div>
</header>
<main>
  <p class="stitle">&#127942; Tabla de Posiciones</p>
  <div class="lb" id="lb"><div class="loading"><div class="spin"></div>Cargando resultados...</div></div>
  <p style="margin-top:16px;font-size:.78rem;color:var(--mt);text-align:center">Haz clic en cualquier participante para ver sus predicciones.</p>
</main>
<div class="ov" id="ov" onclick="if(event.target===this)closeMod()">
  <div class="modal">
    <div class="mhdr">
      <div><h2 id="mname"></h2><div class="mstats" id="mstats"></div></div>
      <button class="mcls" onclick="closeMod()">&#10005;</button>
    </div>
    <div class="gtabs" id="gtabs"></div>
    <table class="pt"><thead><tr><th class="l">Partido</th><th>Tu Prediccion</th><th>Resultado Real</th><th>Pts</th></tr></thead>
    <tbody id="pbody"></tbody></table>
    <div class="legend">
      <span class="li"><span class="ld" style="background:#0d2e1a;border:1px solid #238636"></span>Exacto (4 pts)</span>
      <span class="li"><span class="ld" style="background:#2d1f04;border:1px solid #9e6a03"></span>Resultado (1 pt)</span>
      <span class="li"><span class="ld" style="background:#2d0f0f;border:1px solid #4a1515"></span>Incorrecto</span>
      <span class="li"><span class="ld" style="background:#21262d;border:1px solid #30363d"></span>Sin jugar</span>
    </div>
  </div>
</div>
<script src="predictions.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyDk0ulIH9jcazg6et2adDB1FVyOK6C3K9Y",authDomain:"world-cup-bracket-807b7.firebaseapp.com",projectId:"world-cup-bracket-807b7",storageBucket:"world-cup-bracket-807b7.firebasestorage.app",messagingSenderId:"672760929245",appId:"1:672760929245:web:3edd19b5c58fcf38fe7434"};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
</script>
<script>
var results={};
var activeGrp='ALL';
var currentIdx=0;

function res(h,a){return h>a?'H':h<a?'A':'D';}
function pts(pred,real){
  if(!real||real.homeGoals===undefined)return null;
  var ph=pred.h,pa=pred.a,rh=real.homeGoals,ra=real.awayGoals;
  if(ph===rh&&pa===ra)return 4;
  if(res(ph,pa)===res(rh,ra))return 1;
  return 0;
}
function cls(p){if(p===null)return 'pending';if(p===4)return 'exact';if(p===1)return 'correct';return 'wrong';}
function ini(n){return n.split(' ').slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
function fmtDate(s){if(!s)return '';var d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-CL',{day:'numeric',month:'short'});}

function statFor(p){
  var tot=0,ex=0,co=0;
  for(var i=0;i<MATCHES.length;i++){
    var m=MATCHES[i];
    var pred=p.predictions[m.id];
    var real=results[m.id];
    if(!pred||!real)continue;
    var v=pts(pred,real);
    if(v===4){tot+=4;ex++;}
    else if(v===1){tot+=1;co++;}
  }
  return{tot:tot,ex:ex,co:co};
}

function renderLB(){
  var ranked=PARTICIPANTS.map(function(p,i){var s=statFor(p);return{name:p.name,idx:i,tot:s.tot,ex:s.ex,co:s.co};});
  ranked.sort(function(a,b){return b.tot-a.tot||b.ex-a.ex||b.co-a.co;});
  var rows=ranked.map(function(p,rank){
    var rc=rank===0?'rank r1':rank===1?'rank r2':rank===2?'rank r3':'rank';
    var re=rank===0?'&#129351;':rank===1?'&#129352;':rank===2?'&#129353;':rank+1;
    return '<tr onclick="openMod('+p.idx+')"><td class="'+rc+'">'+re+'</td><td><div class="pname"><div class="av av'+(p.idx%15)+'">'+ini(p.name)+'</div>'+p.name+'</div></td><td class="c"><span class="pts">'+p.tot+'</span></td><td class="c"><span class="badge ex">&#9917; '+p.ex+'</span></td><td class="c"><span class="badge re">&#10003; '+p.co+'</span></td><td class="c"><span class="vl">Ver &rarr;</span></td></tr>';
  }).join('');
  document.getElementById('lb').innerHTML='<table><thead><tr><th>#</th><th>Participante</th><th class="c">Puntos</th><th class="c">Exactos</th><th class="c">Resultados</th><th class="c"></th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function openMod(idx){
  currentIdx=idx;
  activeGrp='ALL';
  document.getElementById('mname').textContent=PARTICIPANTS[idx].name;
  renderMod();
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeMod(){document.getElementById('ov').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMod();});

function renderMod(){
  var p=PARTICIPANTS[currentIdx];
  var s=statFor(p);
  document.getElementById('mstats').innerHTML='<div class="stat"><div class="val">'+s.tot+'</div><div class="lbl">Puntos</div></div><div class="stat"><div class="val" style="color:var(--gtx)">'+s.ex+'</div><div class="lbl">Exactos</div></div><div class="stat"><div class="val" style="color:var(--ytx)">'+s.co+'</div><div class="lbl">Resultados</div></div>';
  var grps=['ALL'].concat(Array.from(new Set(MATCHES.map(function(m){return m.group;}))).sort());
  document.getElementById('gtabs').innerHTML=grps.map(function(g){return '<button class="gtab'+(g===activeGrp?' active':'')+'" onclick="switchGrp(\''+g+'\')">'+( g==='ALL'?'Todos':'Grupo '+g)+'</button>';}).join('');
  var filtered=activeGrp==='ALL'?MATCHES:MATCHES.filter(function(m){return m.group===activeGrp;});
  var rows=filtered.map(function(m){
    var pred=p.predictions[m.id];
    var real=results[m.id];
    var v=pred?pts(pred,real):null;
    var c=cls(v);
    var ps=pred?'<span class="sc">'+pred.h+' - '+pred.a+'</span>':'<span class="sc pend">-</span>';
    var rs=real?'<span class="sc">'+real.homeGoals+' - '+real.awayGoals+'</span>':'<span class="sc pend">?</span>';
    var pv=v===null?'<span class="pcell pending">-</span>':'<span class="pcell '+c+'">'+v+'</span>';
    var rc=c!=='pending'?'r'+c:'';
    return '<tr class="'+rc+'"><td class="l"><div class="mteams">'+m.home+' vs '+m.away+'</div><div class="mdate">'+fmtDate(m.date)+' &middot; <span class="gtag">Grupo '+m.group+'</span></div></td><td>'+ps+'</td><td>'+rs+'</td><td>'+pv+'</td></tr>';
  }).join('');
  document.getElementById('pbody').innerHTML=rows;
}

function switchGrp(g){activeGrp=g;renderMod();}

async function loadResults(){
  try{
    var snap=await db.collection('results').get();
    results={};
    snap.forEach(function(doc){results[parseInt(doc.id)]=doc.data();});
    if(snap.size>0){var t=new Date();document.getElementById('upd').textContent='Actualizado: '+t.toLocaleDateString('es-CL')+' '+t.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});}
  }catch(e){console.warn('Firebase error:',e.message);}
  renderLB();
}

loadResults();
</script>
</body>
</html>
