.score-pill:hover{border-color:var(--ac)}.score-pill.sp-h{border-left:3px solid #3b82f6}.score-pill.sp-d{border-left:3px solid #6b7280}.score-pill.sp-a{border-left:3px solid #ef4444}
.score-pill.is-winner{border-color:#3fb950!important;box-shadow:0 0 0 1px #3fb950}.score-pill.pill-active{border-color:var(--ac)!important;box-shadow:0 0 0 1px var(--ac)}

.no-votes{color:var(--mt);font-size:.75rem;text-align:center;padding:6px}

.voters-box .vtitle{font-size:.72rem;font-weight:700;color:var(--ac);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.voter-chip{display:inline-block;background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:2px 10px;margin:2px;font-size:.75rem}
/* Award stats */
.award-stat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}

<script>
var ROUND_PTS={GROUP:{r:1,e:4},R32:{r:2,e:7},R16:{r:3,e:9},QF:{r:4,e:12},SF:{r:5,e:15},'3RD':{r:5,e:15},F:{r:10,e:25}};
var ROUND_NAMES={R32:'Dieciseisavos',R16:'Octavos de Final',QF:'Cuartos de Final',SF:'Semifinal','3RD':'3er Puesto',F:'Final'};
var AWARD_CONFIG=[
  {key:'champion',label:'Campe&#243;n',pts:'40pts'},{key:'runnerUp',label:'Sub-Campe&#243;n',pts:'20pts'},
  {key:'topScorer',label:'Goleador',pts:'25pts'},{key:'bestPlayer',label:'Mejor Jugador',pts:'25pts'},
  {key:'bestGoalkeeper',label:'Mejor Arquero',pts:'20pts'},{key:'bestU21',label:'Mejor Sub-21',pts:'10pts'}
];
var AWARD_ALIASES={
  'espana':'España','españa':'España',
  'kylian mbappe':'Mbappé','mbappe':'Mbappé','mbappé':'Mbappé','kylian mbappé':'Mbappé',
  'harry kane':'Harry Kane','kane':'Harry Kane',
  'lamine yamal':'Lamine Yamal','yamal':'Lamine Yamal','lamine':'Lamine Yamal',
  'unai simón':'Unai Simón','unai simon':'Unai Simón'
};
function normAward(v){var k=v.trim().toLowerCase();return AWARD_ALIASES[k]||v.trim();}

var results={};var koMatches=[];var koPredictions={};var actualAwards={};
var ALL_MATCHES=[];var ALL_PARTICIPANTS=[];var sortedMatches=[];
var activeTab='lb';var statsGrp='ALL';var selectedMatchId=null;var VOTERS_MAP={};var activePill=null;

function isMobile(){return window.innerWidth<=600;}
function switchTab(t){
  activeTab=t;
  document.getElementById('tab-lb').classList.toggle('active',t==='lb');
  document.getElementById('tab-stats').classList.toggle('active',t==='stats');
  document.getElementById('panel-lb').style.display=t==='lb'?'block':'none';
  document.getElementById('panel-stats').style.display=t==='stats'?'block':'none';
}

function getRes(h,a){return h>a?'H':h<a?'A':'D';}
function ptsForMatch(pred,real,round){
  if(!real||real.homeGoals===undefined)return null;
  var sc=ROUND_PTS[round||'GROUP']||ROUND_PTS.GROUP;
  if(pred.h===real.homeGoals&&pred.a===real.awayGoals)return sc.e;
  if(getRes(pred.h,pred.a)===getRes(real.homeGoals,real.awayGoals))return sc.r;
  return 0;
}
function matchCls(v,round){
  if(v===null)return'pending';
  var sc=ROUND_PTS[round||'GROUP']||ROUND_PTS.GROUP;
  if(v===sc.e)return'exact';if(v>0)return'correct';return'wrong';
}
function ini(n){return n.split(' ').slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
function fmtDate(s){if(!s)return'';var d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-CL',{day:'numeric',month:'short'});}
function fmtScore(r){return r.homeGoals+' - '+r.awayGoals;}
function barH(v,tot){return Math.max(4,Math.round(v/tot*100))+'%';}
function matchTag(m){
  if(m.round&&m.round!=='GROUP')return'<span class="rtag">'+(ROUND_NAMES[m.round]||m.round)+'</span>';
  return'<span class="gtag">Grupo '+(m.group||'')+'</span>';
}

function buildData(){
  ALL_MATCHES=MATCHES.map(function(m){return m.round?m:Object.assign({},m,{round:'GROUP'});}).concat(koMatches);
  ALL_PARTICIPANTS=PARTICIPANTS.map(function(p){
    var kp=koPredictions[p.name]||{};
    var merged=Object.assign({},p.predictions);
    Object.keys(kp).forEach(function(k){merged[parseInt(k)]=kp[k];});
    return{name:p.name,predictions:merged,awards:p.awards||{}};
  });
  sortedMatches=ALL_MATCHES.slice().sort(function(a,b){
    if(a.date&&b.date){var d=a.date.localeCompare(b.date);if(d)return d;}
    return a.id-b.id;
  });
}

/* ── Leaderboard ── */
function statFor(p){
  var tot=0,ex=0,co=0;
  ALL_MATCHES.forEach(function(m){
    var pred=p.predictions[m.id];var real=results[m.id];
    if(!pred||!real)return;
    var rnd=m.round||'GROUP';
    var v=ptsForMatch(pred,real,rnd);
    var sc=ROUND_PTS[rnd]||ROUND_PTS.GROUP;
    if(v===sc.e){tot+=v;ex++;}else if(v>0){tot+=v;co++;}
  });
  return{tot:tot,ex:ex,co:co};
}
function renderLB(){
  var ranked=ALL_PARTICIPANTS.map(function(p,i){var s=statFor(p);return{name:p.name,idx:i,tot:s.tot,ex:s.ex,co:s.co};});
  ranked.sort(function(a,b){return b.tot-a.tot||b.ex-a.ex||b.co-a.co;});
  var rows=ranked.map(function(p,rank){
    var rc=rank===0?'rank r1':rank===1?'rank r2':rank===2?'rank r3':'rank';
    var re=rank===0?'&#129351;':rank===1?'&#129352;':rank===2?'&#129353;':rank+1;
    return'<tr onclick="openMod(\''+encodeURIComponent(p.name)+'\')"><td class="'+rc+'">'+re+'</td><td><div class="pname"><div class="pav pav'+(p.idx%16)+'">'+ini(p.name)+'</div>'+p.name+'</div></td><td class="c"><span class="pts">'+p.tot+'</span></td><td class="c"><span class="badge ex">&#9917; '+p.ex+'</span></td><td class="c"><span class="badge re">&#10003; '+p.co+'</span></td><td class="c"><span class="vl">Ver &rarr;</span></td></tr>';
  }).join('');
  document.getElementById('lb').innerHTML='<table><thead><tr><th>#</th><th>Participante</th><th class="c">Puntos</th><th class="c">Exactos</th><th class="c">Resultados</th><th class="c"></th></tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ── Modal ── */
var modName='';var modGrp='ALL';
function openMod(enc){
  modName=decodeURIComponent(enc);modGrp='ALL';
  document.getElementById('mname').textContent=modName;
  renderMod();document.getElementById('ov').classList.add('open');document.body.style.overflow='hidden';
}
function closeMod(){document.getElementById('ov').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMod();});
function switchModGrp(g){modGrp=g;renderMod();}
function renderMod(){
  var p=ALL_PARTICIPANTS.find(function(x){return x.name===modName;});if(!p)return;
  var s=statFor(p);
  document.getElementById('mstats').innerHTML='<div class="stat"><div class="val">'+s.tot+'</div><div class="lbl">Puntos</div></div><div class="stat"><div class="val" style="color:var(--gtx)">'+s.ex+'</div><div class="lbl">Exactos</div></div><div class="stat"><div class="val" style="color:var(--ytx)">'+s.co+'</div><div class="lbl">Resultados</div></div>';
  var grps=Array.from(new Set(MATCHES.map(function(m){return m.group;}))).sort();
  var koRnds=Array.from(new Set(koMatches.map(function(m){return m.round;}))).filter(Boolean);
  var tabs=[{k:'ALL',l:'Todos'},{k:'GROUP',l:'Grupos'}]
    .concat(grps.map(function(g){return{k:'GRP_'+g,l:'Grupo '+g};}))
    .concat(koRnds.map(function(r){return{k:r,l:ROUND_NAMES[r]||r};}))
    .concat([{k:'AWARDS',l:'&#127942; Premios'}]);
  document.getElementById('gtabs').innerHTML=tabs.map(function(t){
    return'<button class="gtab'+(t.k===modGrp?' active':'')+'" onclick="switchModGrp(\''+t.k+'\')">'+t.l+'</button>';
  }).join('');
  if(modGrp==='AWARDS'){renderAwardsTab(p);return;}
  var filtered;
  if(modGrp==='ALL')filtered=ALL_MATCHES;
  else if(modGrp==='GROUP')filtered=ALL_MATCHES.filter(function(m){return(m.round||'GROUP')==='GROUP';});
  else if(modGrp.startsWith('GRP_'))filtered=ALL_MATCHES.filter(function(m){return m.group===modGrp.slice(4);});
  else filtered=ALL_MATCHES.filter(function(m){return m.round===modGrp;});
  var rows=filtered.map(function(m){
    var pred=p.predictions[m.id];var real=results[m.id];
    var rnd=m.round||'GROUP';var v=pred?ptsForMatch(pred,real,rnd):null;
    var c=matchCls(v,rnd);var sc=ROUND_PTS[rnd]||ROUND_PTS.GROUP;
    var ps=pred?'<span class="sc">'+pred.h+' - '+pred.a+'</span>':'<span class="sc pend">-</span>';
    var rs=real?'<span class="sc">'+real.homeGoals+' - '+real.awayGoals+'</span>':'<span class="sc pend">?</span>';
    var pv=v===null?'<span class="pcell pending">-</span>':'<span class="pcell '+c+'">'+v+'</span>';
    var rc=c!=='pending'?'r'+c:'';
    return'<tr class="'+rc+'"><td class="l"><div class="mteams">'+m.home+' vs '+m.away+'</div><div class="mdate">'+fmtDate(m.date)+' &middot; '+matchTag(m)+'<span style="font-size:.65rem;color:var(--mt)"> max '+sc.e+'pts</span></div></td><td>'+ps+'</td><td>'+rs+'</td><td>'+pv+'</td></tr>';
  }).join('');
  document.getElementById('modal-body').innerHTML='<table class="pt"><thead><tr><th class="l">Partido</th><th>Predicci&#243;n</th><th>Real</th><th>Pts</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="legend"><span class="li"><span class="ld" style="background:#0d2e1a;border:1px solid #238636"></span>Exacto</span><span class="li"><span class="ld" style="background:#2d1f04;border:1px solid #9e6a03"></span>Resultado</span><span class="li"><span class="ld" style="background:#2d0f0f;border:1px solid #4a1515"></span>Incorrecto</span><span class="li"><span class="ld" style="background:#21262d;border:1px solid #30363d"></span>Sin jugar</span></div>';
}
function renderAwardsTab(p){
  var aw=p.awards||{};var html='<div class="awards-grid">';
  AWARD_CONFIG.forEach(function(cfg){
    var raw=(aw[cfg.key]||'').trim();var val=raw?normAward(raw):'&mdash;';
    html+='<div class="award-card"><div class="award-lbl">'+cfg.label+'</div><div class="award-val">'+val+'</div><div class="award-pts">'+cfg.pts+'</div></div>';
  });
  document.getElementById('modal-body').innerHTML=html+'</div>';
}

/* ── Stats tab ── */
function buildFilters(){
  var grps=Array.from(new Set(MATCHES.map(function(m){return m.group;}))).sort();
  var koRnds=Array.from(new Set(koMatches.map(function(m){return m.round;}))).filter(Boolean);
  var html='<button class="gf active" onclick="filterGrp(\'ALL\',this)">Todos</button>';
  grps.forEach(function(g){html+='<button class="gf" onclick="filterGrp(\'GRP_'+g+'\',this)">Grupo '+g+'</button>';});
  koRnds.forEach(function(r){html+='<button class="gf ko" onclick="filterGrp(\''+r+'\',this)">'+(ROUND_NAMES[r]||r)+'</button>';});
  html+='<button class="gf ko" onclick="filterGrp(\'AWARDS\',this)">&#127942; Premios</button>';
  document.getElementById('grp-filters').innerHTML=html;
}

function filterGrp(g,el){
  statsGrp=g;selectedMatchId=null;activePill=null;VOTERS_MAP={};
  document.querySelectorAll('.gf').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  if(g==='AWARDS'){renderAwardsStats();return;}
  buildMatchList();
}

function buildMatchList(){
  var list;
  if(statsGrp==='ALL')list=sortedMatches.slice();
  else if(statsGrp.startsWith('GRP_'))list=sortedMatches.filter(function(m){return m.group===statsGrp.slice(4);});
  else list=sortedMatches.filter(function(m){return m.round===statsGrp;});

  var upcoming=list.filter(function(m){return!results[m.id];});
  var played=list.filter(function(m){return!!results[m.id];});
  // played: most recent first
  played.sort(function(a,b){
    if(a.date&&b.date){var d=b.date.localeCompare(a.date);if(d)return d;}
    return b.id-a.id;
  });

  function matchHtml(m){
    var votes={H:0,D:0,A:0};
    ALL_PARTICIPANTS.forEach(function(p){var pr=p.predictions[m.id];if(pr)votes[getRes(pr.h,pr.a)]++;});
    var tot2=votes.H+votes.D+votes.A||1;
    var wH=Math.round(votes.H/tot2*52),wD=Math.round(votes.D/tot2*52),wA=52-wH-wD;
    var real=results[m.id];
    var isKo=m.round&&m.round!=='GROUP';
    var sel=selectedMatchId===m.id?' selected':'';
    return'<div class="match-row'+(real?' played':'')+(isKo?' ko-match':'')+sel+'" id="mr-'+m.id+'" onclick="showStats('+m.id+')">'
      +'<div class="mr-top"><span class="mr-teams">'+m.home+' vs '+m.away+'</span>'+(real?'<span class="real-score">'+fmtScore(real)+'</span>':'')+'</div>'
      +'<div class="mr-bottom"><div class="mr-meta">'+matchTag(m)+(m.date?' &middot; <span>'+fmtDate(m.date)+'</span>':'')+(real?'<span style="color:#3fb950;font-size:.65rem">&#10003; Jugado</span>':'')+'</div>'
      +'<div class="mini-bar"><div class="mini-seg seg-h" style="width:'+wH+'px;min-width:'+(votes.H?3:0)+'px"></div><div class="mini-seg seg-d" style="width:'+wD+'px;min-width:'+(votes.D?3:0)+'px"></div><div class="mini-seg seg-a" style="width:'+wA+'px;min-width:'+(votes.A?3:0)+'px"></div></div></div>'
      +'</div>'
      +'<div class="stats-inline" id="si-'+m.id+'"></div>';
  }

  var html='';
  if(upcoming.length>0){
    html+='<div class="sec-hdr">&#128197; Pr&#243;ximos partidos</div>';
    upcoming.forEach(function(m){html+=matchHtml(m);});
  }
  if(played.length>0){
    html+='<div class="sec-hdr">&#9989; Partidos jugados</div>';
    played.forEach(function(m){html+=matchHtml(m);});
  }
  document.getElementById('stats-main').innerHTML=html;
}

function showStats(matchId){
  // Close previous
  if(selectedMatchId&&selectedMatchId!==matchId){
    var prevRow=document.getElementById('mr-'+selectedMatchId);
    var prevPanel=document.getElementById('si-'+selectedMatchId);
    if(prevRow){prevRow.classList.remove('selected');}
    if(prevPanel){prevPanel.classList.remove('open');prevPanel.innerHTML='';}
    activePill=null;VOTERS_MAP={};
  }
  // Toggle if same match clicked again
  if(selectedMatchId===matchId){
    var row2=document.getElementById('mr-'+matchId);
    var panel2=document.getElementById('si-'+matchId);
    if(panel2&&panel2.classList.contains('open')){
      panel2.classList.remove('open');panel2.innerHTML='';
      if(row2)row2.classList.remove('selected');
      selectedMatchId=null;return;
    }
  }
  selectedMatchId=matchId;
  var row=document.getElementById('mr-'+matchId);
  var panel=document.getElementById('si-'+matchId);
  if(!row||!panel)return;
  row.classList.add('selected');

  var m=ALL_MATCHES.find(function(x){return x.id===matchId;});
  var real=results[matchId];
  var rnd=m.round||'GROUP';
  var sc=ROUND_PTS[rnd]||ROUND_PTS.GROUP;
  var votes={H:0,D:0,A:0};var sm={};
  ALL_PARTICIPANTS.forEach(function(p){
    var pr=p.predictions[matchId];if(!pr)return;
    var r=getRes(pr.h,pr.a);votes[r]++;
    var k=pr.h+'-'+pr.a;sm[k]=(sm[k]||[]).concat(p.name);
  });
  var tot=ALL_PARTICIPANTS.length;
  var winR=real?getRes(real.homeGoals,real.awayGoals):null;
  var winK=real?(real.homeGoals+'-'+real.awayGoals):null;
  var bkts={H:[],D:[],A:[]};
  Object.keys(sm).forEach(function(k){
    var ps2=k.split('-');var h=parseInt(ps2[0]),a=parseInt(ps2[1]);
    bkts[getRes(h,a)].push({score:k,voters:sm[k],count:sm[k].length});
  });
  bkts.H.sort(function(a,b){return b.count-a.count;});
  bkts.D.sort(function(a,b){return parseInt(a.score)-parseInt(b.score)||b.count-a.count;});
  bkts.A.sort(function(a,b){return b.count-a.count;});
  var maxC=Math.max.apply(null,Object.values(sm).map(function(v){return v.length;}).concat([1]));

  function pills(arr,cls2,col){
    if(!arr.length)return'<div class="no-votes">Sin votos</div>';
    return arr.map(function(e){
      var pct=Math.round(e.count/tot*100);
      var bw=Math.round(e.count/maxC*100);
      var isW=winK&&e.score===winK;
      var vKey=matchId+'_'+e.score.replace('-','x');
      VOTERS_MAP[vKey]=e.voters;
      var pillId='pill-'+matchId+'-'+e.score.replace('-','x');
      return'<div class="score-pill '+cls2+(isW?' is-winner':'')+'" id="'+pillId+'" onclick="toggleVoters('+matchId+',\''+e.score+'\')">'
        +'<div class="pill-bg" style="width:'+bw+'%;background:'+col+'"></div>'
        +'<span class="sp-score">'+e.score+'</span>'
        +'<div class="sp-right"><div class="sp-dot" style="background:'+col+'"></div><span class="sp-count">'+e.count+' ('+pct+'%)</span></div>'
        +'</div>'
        +'<div id="voters-'+matchId+'-'+e.score.replace('-','x')+'" style="display:none"></div>';
    }).join('');
  }
  function rBar(v,fillCls,lbl,col,isW){
    return'<div class="res-bar"><div class="res-label" style="color:'+col+'">'+lbl+'</div>'
      +'<div class="res-track"><div class="res-fill '+fillCls+(isW?' winner':'')+'" style="height:'+barH(v,tot)+'"></div></div>'
      +'<div class="res-pct" style="color:'+col+'">'+Math.round(v/tot*100)+'%</div>'
      +'<div class="res-count">'+v+' votos</div>'
      +(isW?'<div class="res-wtag">&#10003; Resultado real</div>':'')+'</div>';
  }
  var ptsBadge=rnd!=='GROUP'?'<span class="pts-badge">&#9733; Exacto='+sc.e+'pts &bull; Res='+sc.r+'pts</span>':'';
  panel.innerHTML=
    '<div class="stats-hdr"><h2>'+m.home+' vs '+m.away+'</h2><div class="sub">'+matchTag(m)+(m.date?' &middot; '+fmtDate(m.date):'')+' &middot; '+tot+' participantes'+(real?' <span class="played-badge">&#9989; '+fmtScore(real)+'</span>':'')+' '+ptsBadge+'</div></div>'
    +'<div class="stats-body">'
    +'<div class="sec-title">Pron&#243;stico de resultado</div>'
    +'<div class="result-bars">'
    +rBar(votes.H,'fill-h','&#127942; '+m.home,'#93c5fd',winR==='H')
    +rBar(votes.D,'fill-d','Empate','#d1d5db',winR==='D')
    +rBar(votes.A,'fill-a','&#127942; '+m.away,'#fca5a5',winR==='A')
    +'</div>'
    +'<div class="sec-title">Marcadores &mdash; clic para ver qui&#233;n apost&#243;</div>'
    +'<div class="score-cols">'
    +'<div class="score-col"><div class="col-title ct-h">'+m.home+' gana</div>'+pills(bkts.H,'sp-h','#3b82f6')+'</div>'
    +'<div class="score-col draws"><div class="col-title ct-d">Empate</div>'+pills(bkts.D,'sp-d','#6b7280')+'</div>'
    +'<div class="score-col"><div class="col-title ct-a">'+m.away+' gana</div>'+pills(bkts.A,'sp-a','#ef4444')+'</div>'
    +'</div></div>';
  panel.classList.add('open');
  setTimeout(function(){row.scrollIntoView({behavior:'smooth',block:'start'});},50);
}

function toggleVoters(matchId,score){
  var voters=VOTERS_MAP[matchId+'_'+score.replace('-','x')]||[];
  var pillId='pill-'+matchId+'-'+score.replace('-','x');
  var boxId='voters-'+matchId+'-'+score.replace('-','x');
  var pill=document.getElementById(pillId);var box=document.getElementById(boxId);
  if(!pill||!box)return;
  var isOpen=box.style.display!=='none';
  if(activePill&&activePill!==boxId){
    var prev=document.getElementById(activePill);
    var prevPill=document.getElementById(activePill.replace('voters-','pill-'));
    if(prev)prev.style.display='none';
    if(prevPill)prevPill.classList.remove('pill-active');
  }
  if(isOpen){box.style.display='none';pill.classList.remove('pill-active');activePill=null;}
  else{
    box.innerHTML='<div class="voters-box"><div class="vtitle">'+score+' &mdash; '+voters.length+' voto'+(voters.length!==1?'s':'')+'</div>'+voters.map(function(n){return'<span class="voter-chip">'+n+'</span>';}).join('')+'</div>';
    box.style.display='block';pill.classList.add('pill-active');activePill=boxId;
  }
}

function renderAwardsStats(){
  var winnerAwards=actualAwards||{};
  var html='<div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden">'
    +'<div class="stats-hdr"><h2>&#127942; Premios Individuales</h2><div class="sub">Puntos al final del Mundial</div></div>'
    +'<div class="stats-body">';
  AWARD_CONFIG.forEach(function(cfg){
    var winner=normAward(winnerAwards[cfg.key]||'');
    var normWinner=winner.toLowerCase();
    var votes={};
    ALL_PARTICIPANTS.forEach(function(p){
      var raw=((p.awards||{})[cfg.key]||'').trim();if(!raw)return;
      var canonical=normAward(raw);var norm=canonical.toLowerCase();
      if(!votes[norm]){votes[norm]={display:canonical,names:[]};}
      votes[norm].names.push(p.name);
    });
    var sorted=Object.keys(votes).sort(function(a,b){return votes[b].names.length-votes[a].names.length;});
    html+='<div class="award-stat-row"><div class="award-stat-label">'+cfg.label+'<br><span style="font-size:.68rem;color:var(--ac)">'+cfg.pts+'</span></div><div class="award-votes">';
    sorted.forEach(function(norm){
      var entry=votes[norm];var isW=normWinner&&norm===normWinner;
      html+='<div class="avote'+(isW?' winner-award':'')+'"><span class="an">'+entry.display+'</span><span class="ac">x'+entry.names.length+'</span></div>';
    });
    html+='</div></div>';
  });
  document.getElementById('stats-main').innerHTML=html+'</div></div>';
}

/* ── Firebase load ── */
async function loadAll(){
  try{var rSnap=await db.collection('results').get();
    rSnap.forEach(function(doc){results[parseInt(doc.id)]=doc.data();});
    if(rSnap.size>0){var t=new Date();document.getElementById('upd').textContent='Actualizado: '+t.toLocaleDateString('es-CL')+' '+t.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});}
  }catch(e){console.warn('results:',e.message);}
  try{var koSnap=await db.collection('ko_matches').get();
    koSnap.forEach(function(doc){koMatches.push(doc.data());});
    koMatches.sort(function(a,b){return a.id-b.id;});
  }catch(e){console.warn('ko_matches:',e.message);}
  try{var kpSnap=await db.collection('ko_predictions').get();
    kpSnap.forEach(function(doc){koPredictions[doc.id]=doc.data();});
  }catch(e){console.warn('ko_predictions:',e.message);}
  try{var awDoc=await db.collection('settings').doc('awards').get();
    if(awDoc.exists)actualAwards=awDoc.data();
  }catch(e){console.warn('awards:',e.message);}
  buildData();renderLB();buildFilters();buildMatchList();
}
loadAll();
</script>
